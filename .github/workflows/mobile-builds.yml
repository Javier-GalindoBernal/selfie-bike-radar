name: Comprobar y compilar apps móviles
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-builds.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Flutter desde su repositorio oficial
        run: |
          git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencias, análisis y pruebas
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Generar APK de pruebas
        working-directory: mobile
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: selfie-bike-radar-android-pruebas
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Flutter desde su repositorio oficial
        run: |
          git clone --depth 1 --branch 3.50.1 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencias y compilación iOS sin firma
        working-directory: mobile
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/iphoneos/SelfieBikeRadar-sin-firma.zip
      - uses: actions/upload-artifact@v4
        with:
          name: selfie-bike-radar-ios-sin-firma-no-instalable
          path: mobile/build/ios/iphoneos/SelfieBikeRadar-sin-firma.zip
